name: android
on:
  push:
  workflow_dispatch:
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --experimental-strip-types --no-warnings --test core/*.test.ts
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npx next build
      - uses: actions/upload-artifact@v4
        with: { name: web-out, path: out }
  apk:
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install --no-audit --no-fund
      - run: npx next build
      - run: npx cap add android
      - run: python3 android-overlay/apply.py
      - run: npx cap sync android
      - run: cd android && ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: debug-apk, path: android/app/build/outputs/apk/debug/app-debug.apk }
