name: android
on:
  push:
  workflow_dispatch:
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --experimental-strip-types --no-warnings --test core/*.test.ts
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npx next build
      - uses: actions/upload-artifact@v4
        with: { name: web-out, path: out }
  apk:
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install --no-audit --no-fund
      - run: npx next build
      - run: npx cap add android
      - run: python3 android-overlay/apply.py
      - run: npx cap sync android
      - run: cd android && ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: debug-apk, path: android/app/build/outputs/apk/debug/app-debug.apk }
  emulator:
    needs: apk
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [34]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/download-artifact@v4
        with: { name: debug-apk, path: apk }
      - run: cd e2e && npm install --no-audit --no-fund
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_5
          disable-animations: true
          script: |
            adb install -r apk/app-debug.apk
            adb shell dumpsys webview | grep -i "current webview" || true
            cd e2e && node core.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-shot-${{ matrix.api }}
          path: e2e/final.png
          if-no-files-found: ignore
