name: android
# Manual only: Actions -> android -> Run workflow.
on:
  workflow_dispatch:
    inputs:
      sign:
        description: "Also build the SIGNED release APK (needs the 4 signing secrets, see SETUP.md)"
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --experimental-strip-types --no-warnings --test core/*.test.ts
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npx next build

  test-apk:
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install --no-audit --no-fund
      - run: npx next build
      - run: npx cap add android
      - run: python3 android-overlay/apply.py
      - run: npx cap sync android
      - run: cd android && ./gradlew --no-daemon assembleDebug
      - name: Publish test build to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk DailyExpenses-test.apk
          gh release delete test-build --cleanup-tag --yes -R "$GITHUB_REPOSITORY" || true
          gh release create test-build DailyExpenses-test.apk -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Test build (unsigned, for testing only)" \
            --notes "Debug build from commit ${GITHUB_SHA::7}. Phones may warn about it. Use the signed release when available."

  signed-release:
    if: ${{ inputs.sign }}
    needs: web
    runs-on: ubuntu-latest
    env:
      KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      RELEASE_SIGNING: "1"
      VERSION_NAME: "1.0.0"
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Check signing secrets exist
        run: |
          for v in KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "${!v}" ] || { echo "::error::Missing secret $v. See SETUP.md section 6."; exit 1; }
          done
          [ -n "${{ secrets.KEYSTORE_BASE64 }}" ] || { echo "::error::Missing secret KEYSTORE_BASE64"; exit 1; }
      - run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$KEYSTORE_PATH"
      - run: npm install --no-audit --no-fund
      - run: npx next build
      - run: npx cap add android
      - run: python3 android-overlay/apply.py
      - run: npx cap sync android
      - run: cd android && ./gradlew --no-daemon assembleRelease
      - name: Verify signature and that the build is not debuggable
        run: |
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --verbose --print-certs "$APK"
          "$BT/aapt" dump badging "$APK" | grep -E "package:|sdkVersion|targetSdk|uses-permission"
          if "$BT/aapt" dump xmltree "$APK" AndroidManifest.xml | grep -q "debuggable.*0xffffffff"; then echo "::error::APK is debuggable"; exit 1; fi
          cp "$APK" DailyExpenses.apk
      - name: Publish signed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" DailyExpenses.apk -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Daily Expenses $TAG" --notes "Signed release build from commit ${GITHUB_SHA::7}."
